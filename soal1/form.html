<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.error {
            border-color: #e74c3c;
        }

        input.success {
            border-color: #27ae60;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
            animation: slideIn 0.5s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            input {
                padding: 10px 12px;
                font-size: 14px;
            }

            button {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Form Pendaftaran</h1>
        <p class="subtitle">Silakan lengkapi data Anda di bawah ini</p>
        
        <form id="registrationForm">
            <div class="form-group">
                <label for="fullname">Nama Lengkap</label>
                <input type="text" id="fullname" name="fullname" required>
                <div class="error-message" id="fullnameError">Nama lengkap harus diisi</div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <div class="error-message" id="emailError">Format email tidak valid</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <div class="error-message" id="passwordError">Password harus minimal 8 karakter</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <div class="error-message" id="confirmPasswordError">Password tidak cocok</div>
            </div>

            <button type="submit">Daftar Sekarang</button>
        </form>

        <div class="success-message" id="successMessage">
            ✓ Pendaftaran Berhasil
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const fullname = document.getElementById('fullname');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const successMessage = document.getElementById('successMessage');

        // Validasi email dengan regex
        function isValidEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        // Fungsi untuk menampilkan error
        function showError(input, message) {
            const formGroup = input.parentElement;
            const errorDiv = formGroup.querySelector('.error-message');
            
            input.classList.add('error');
            input.classList.remove('success');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // Fungsi untuk menampilkan success
        function showSuccess(input) {
            const formGroup = input.parentElement;
            const errorDiv = formGroup.querySelector('.error-message');
            
            input.classList.add('success');
            input.classList.remove('error');
            errorDiv.classList.remove('show');
        }

        // Validasi nama lengkap
        function validateFullname() {
            if (fullname.value.trim() === '') {
                showError(fullname, 'Nama lengkap harus diisi');
                return false;
            } else {
                showSuccess(fullname);
                return true;
            }
        }

        // Validasi email
        function validateEmail() {
            if (email.value.trim() === '') {
                showError(email, 'Email harus diisi');
                return false;
            } else if (!isValidEmail(email.value.trim())) {
                showError(email, 'Format email tidak valid');
                return false;
            } else {
                showSuccess(email);
                return true;
            }
        }

        // Validasi password
        function validatePassword() {
            if (password.value === '') {
                showError(password, 'Password harus diisi');
                return false;
            } else if (password.value.length < 8) {
                showError(password, 'Password harus minimal 8 karakter');
                return false;
            } else {
                showSuccess(password);
                return true;
            }
        }

        // Validasi konfirmasi password
        function validateConfirmPassword() {
            if (confirmPassword.value === '') {
                showError(confirmPassword, 'Konfirmasi password harus diisi');
                return false;
            } else if (password.value !== confirmPassword.value) {
                showError(confirmPassword, 'Password tidak cocok');
                return false;
            } else {
                showSuccess(confirmPassword);
                return true;
            }
        }

        // Event listeners untuk validasi real-time
        fullname.addEventListener('blur', validateFullname);
        email.addEventListener('blur', validateEmail);
        password.addEventListener('blur', validatePassword);
        password.addEventListener('input', function() {
            if (confirmPassword.value !== '') {
                validateConfirmPassword();
            }
        });
        confirmPassword.addEventListener('blur', validateConfirmPassword);
        confirmPassword.addEventListener('input', validateConfirmPassword);

        // Submit form
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Validasi semua field
            const isFullnameValid = validateFullname();
            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();
            const isConfirmPasswordValid = validateConfirmPassword();

            // Jika semua valid, tampilkan pesan sukses
            if (isFullnameValid && isEmailValid && isPasswordValid && isConfirmPasswordValid) {
                successMessage.classList.add('show');
                form.reset();
                
                // Reset semua styling
                [fullname, email, password, confirmPassword].forEach(input => {
                    input.classList.remove('success', 'error');
                });

                // Sembunyikan pesan sukses setelah 5 detik
                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 5000);
            }
        });
    </script>
</body>
</html>
